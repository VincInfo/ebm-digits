[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebm-digits"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
]

[project.scripts]
ebm-train = "ebm_digits.train:train"
ebm-sample = "ebm_digits.sample:main"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ebm_digits"]
